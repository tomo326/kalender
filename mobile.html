<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LifeLog">
  <link rel="apple-touch-icon" href="images/wallpapers/bg_chibi_crossover.jpg">
  <link rel="manifest" href="manifest.json">
  <title>LifeLog - スマホ専用カレンダー</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* スマホ専用1画面レイアウト（スクロール禁止でアプリ化） */
    html, body {
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .mobile-app-container {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 6px) 8px env(safe-area-inset-bottom, 8px) 8px;
    }
    /* カレンダーセル：均等分配 */
    .mobile-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(6, 1fr);
      flex: 1;
      height: 100%;
    }
    .mobile-calendar-grid .calendar-cell,
    .mobile-cell {
      display: flex;
      flex-direction: column;
      padding: 2px 2px;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      cursor: pointer;
      min-height: 0 !important;
    }
    .mobile-calendar-grid .calendar-cell:nth-child(7n),
    .mobile-cell:nth-child(7n) {
      border-right: none;
    }
    /* ボトムシートモーダル表示アニメーション確実化 */
    #dayModal.modal-active > div,
    #settingsModal.modal-active > div {
      transform: translateY(0) !important;
    }
  </style>
</head>
<body class="wall-chibi-room font-rounded size-normal text-slate-100 select-none">

  <!-- スマホ専用1画面コンテナ -->
  <div class="mobile-app-container">
    
    <!-- スマホ専用コンパクトヘッダー -->
    <header class="flex items-center justify-between py-1.5 px-2 mb-1.5 rounded-2xl bg-slate-900/80 backdrop-blur-md border border-white/20 shadow-sm shrink-0">
      <!-- 月切り替え -->
      <div class="flex items-center gap-1">
        <button id="prevMonthBtn" class="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white border border-white/15 active:scale-90 transition min-w-[28px] min-h-[28px] flex items-center justify-center">
          <i data-lucide="chevron-left" class="w-4 h-4 flex items-center justify-center font-bold text-xs">◀</i>
        </button>
        <span id="currentMonthLabel" class="text-sm font-black text-white px-1 tracking-tight min-w-[85px] text-center">
          2026年 11月
        </span>
        <button id="nextMonthBtn" class="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white border border-white/15 active:scale-90 transition min-w-[28px] min-h-[28px] flex items-center justify-center">
          <i data-lucide="chevron-right" class="w-4 h-4 flex items-center justify-center font-bold text-xs">▶</i>
        </button>
        <button id="todayBtn" class="ml-1 px-2.5 py-1 text-xs font-black rounded-xl bg-indigo-600 active:bg-indigo-700 text-white shadow-xs">
          今日
        </button>
      </div>

      <!-- 右側アクション -->
      <div class="flex items-center gap-1.5">
        <a href="index.html?noredirect=true" class="px-2 py-1 text-[11px] font-bold rounded-xl bg-slate-800/90 text-slate-300 border border-white/10 flex items-center gap-1" title="PC版表示">
          <i data-lucide="monitor" class="w-3.5 h-3.5 flex items-center justify-center text-[10px]">💻</i>
          <span>PC版</span>
        </a>
        <button id="openGlobalSettingsBtn" class="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white border border-white/20 active:scale-90 transition min-w-[28px] min-h-[28px] flex items-center justify-center" title="設定">
          <i data-lucide="settings" class="w-4 h-4 text-indigo-400 flex items-center justify-center font-bold text-xs">⚙</i>
        </button>
      </div>
    </header>

    <!-- 今日の活動項目（ミニ凡例バー） -->
    <div id="legendContainer" class="flex gap-1 overflow-x-auto pb-1 mb-1 shrink-0 no-scrollbar">
      <!-- JSで生成 -->
    </div>

    <!-- カレンダー本体（スマホの画面いっぱいに広がる1画面グリッド） -->
    <div class="calendar-card card-glass-dark rounded-2xl border flex-1 flex flex-col overflow-hidden shadow-md">
      <!-- 曜日ヘッダー -->
      <div class="calendar-header-weekday grid grid-cols-7 border-b border-white/10 text-center text-xs font-black py-1 shrink-0">
        <div class="text-rose-400">日</div>
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
        <div class="text-sky-400">土</div>
      </div>

      <!-- 日付グリッド -->
      <div id="calendarGrid" class="mobile-calendar-grid divide-slate-800/40">
        <!-- JSで日付セル生成 -->
      </div>
    </div>
  </div>

  <!-- 日ビュー・ボトムシート（スマホ専用） -->
  <div id="dayModal" class="fixed inset-0 z-50 flex items-end justify-center bg-slate-950/70 backdrop-blur-xs opacity-0 pointer-events-none transition-opacity duration-200">
    <div id="dayModalCard" class="bg-slate-900 text-white w-full max-w-lg rounded-t-3xl border-t border-white/20 shadow-2xl overflow-hidden flex flex-col max-h-[88dvh] transition-transform duration-200 translate-y-full">
      
      <!-- 引き出しバー ＆ ヘッダー -->
      <div class="pt-2 px-5 pb-3 border-b border-white/10 bg-slate-800/90 flex flex-col gap-1.5">
        <div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-1"></div>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-1.5">
            <button id="modalPrevDayBtn" class="p-1 rounded-lg bg-slate-700/60 text-white active:scale-90 min-w-[24px] min-h-[24px] flex items-center justify-center">
              <i data-lucide="chevron-left" class="w-4 h-4 flex items-center justify-center font-bold text-xs">◀</i>
            </button>
            <h2 id="modalDateTitle" class="text-base font-black text-white px-1">
              2026年11月1日 (日)
            </h2>
            <button id="modalNextDayBtn" class="p-1 rounded-lg bg-slate-700/60 text-white active:scale-90 min-w-[24px] min-h-[24px] flex items-center justify-center">
              <i data-lucide="chevron-right" class="w-4 h-4 flex items-center justify-center font-bold text-xs">▶</i>
            </button>
          </div>
          <button id="closeDayModalBtn" class="p-1.5 rounded-full bg-slate-800 text-slate-400 active:bg-slate-700 min-w-[28px] min-h-[28px] flex items-center justify-center">
            <i data-lucide="x" class="w-4 h-4 flex items-center justify-center font-bold text-xs">✕</i>
          </button>
        </div>
      </div>

      <!-- 本文（スクロール可） -->
      <div class="p-4 overflow-y-auto space-y-4 flex-1">
        <!-- 項目選択 -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
              <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-indigo-400"></i>
              今日やったこと
            </span>
            <div class="flex gap-1.5">
              <button type="button" id="selectAllItemsBtn" class="px-2 py-0.5 text-xs font-bold rounded-lg bg-indigo-600 text-white active:scale-95 shadow-xs">
                全選択
              </button>
              <button type="button" id="deselectAllItemsBtn" class="px-2 py-0.5 text-xs font-bold rounded-lg bg-slate-800 text-slate-300 border border-white/10 active:scale-95">
                解除
              </button>
            </div>
          </div>
          <div id="modalItemChips" class="grid grid-cols-1 gap-2">
            <!-- JSで動的生成 -->
          </div>
        </div>

        <!-- 日記 -->
        <div>
          <label for="modalDiaryText" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 flex items-center gap-1">
            <i data-lucide="edit-3" class="w-3.5 h-3.5 text-indigo-400"></i>
            ひとこと日記・記録メモ
          </label>
          <textarea id="modalDiaryText" rows="3" placeholder="成果やスコア、今日の気づきをメモ..." class="w-full px-3 py-2 rounded-xl border border-white/15 bg-slate-800/80 text-white text-xs leading-relaxed focus:outline-none focus:border-indigo-400 resize-none"></textarea>
        </div>
      </div>

      <!-- フッター -->
      <div class="p-3 border-t border-white/10 bg-slate-800/90 flex items-center justify-between pb-safe">
        <button id="deleteEntryBtn" class="text-xs text-rose-400 font-bold px-2 py-1 rounded-lg">
          消去
        </button>
        <div class="flex gap-2">
          <button id="cancelModalBtn" class="px-3 py-1.5 text-xs font-bold text-slate-300 rounded-xl bg-slate-700/60">
            閉じる
          </button>
          <button id="saveModalBtn" class="px-5 py-1.5 text-xs font-black text-white bg-indigo-600 active:bg-indigo-700 rounded-xl shadow-md flex items-center gap-1">
            <i data-lucide="check" class="w-3.5 h-3.5"></i> 保存
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 総合設定モーダル（スマホ専用ボトムシート） -->
  <div id="settingsModal" class="fixed inset-0 z-50 flex items-end justify-center bg-slate-950/70 backdrop-blur-xs opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-slate-900 text-white w-full max-w-lg rounded-t-3xl border-t border-white/20 shadow-2xl overflow-hidden flex flex-col max-h-[88dvh] transition-transform duration-200 translate-y-full">
      <div class="pt-2 px-5 pb-2.5 border-b border-white/10 bg-slate-800/90 flex flex-col gap-1.5">
        <div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-1"></div>
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-black text-white flex items-center gap-1.5">
            <i data-lucide="settings" class="w-4 h-4 text-indigo-400"></i> カレンダー設定
          </h3>
          <button id="closeSettingsModalBtn" class="p-1.5 rounded-full bg-slate-800 text-slate-400 active:bg-slate-700 min-w-[28px] min-h-[28px] flex items-center justify-center">
            <i data-lucide="x" class="w-4 h-4 flex items-center justify-center font-bold text-xs">✕</i>
          </button>
        </div>
      </div>

      <!-- タブメニュー -->
      <div class="flex border-b border-white/10 bg-slate-800/50 px-3 gap-2">
        <button data-tab="tab-display" class="settings-tab-btn active px-3 py-2 text-xs font-black border-b-2 border-indigo-500 text-indigo-400">
          表示・壁紙
        </button>
        <button data-tab="tab-items" class="settings-tab-btn px-3 py-2 text-xs font-bold border-b-2 border-transparent text-slate-400">
          項目管理
        </button>
        <button data-tab="tab-backup" class="settings-tab-btn px-3 py-2 text-xs font-bold border-b-2 border-transparent text-slate-400">
          保存・復元
        </button>
      </div>

      <div class="p-4 overflow-y-auto space-y-4 flex-1">
        <!-- 表示タブ -->
        <div id="tab-display" class="tab-content space-y-4">
          <!-- カレンダースタイル12色 -->
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1.5">カレンダー枠のスタイル</label>
            <div class="grid grid-cols-3 gap-1.5 max-h-36 overflow-y-auto" id="cardStyleOptionContainer">
              <button data-cardstyle="card-glass-white" class="cardstyle-select-btn p-2 rounded-xl border border-white/20 bg-white text-slate-900 text-xs font-black truncate">白すりガラス</button>
              <button data-cardstyle="card-glass-milky" class="cardstyle-select-btn p-2 rounded-xl border border-white/20 bg-purple-100 text-purple-950 text-xs font-bold truncate">ミルキー紫</button>
              <button data-cardstyle="card-glass-mint" class="cardstyle-select-btn p-2 rounded-xl border border-white/20 bg-teal-100 text-teal-950 text-xs font-bold truncate">ミント緑</button>
              <button data-cardstyle="card-glass-dark" class="cardstyle-select-btn p-2 rounded-xl border border-white/20 bg-slate-900 text-white text-xs font-bold truncate">ダーク</button>
              <button data-cardstyle="card-glass-pink" class="cardstyle-select-btn p-2 rounded-xl border border-white/20 bg-pink-950 text-white text-xs font-bold truncate">ピンク</button>
              <button data-cardstyle="card-glass-cyan" class="cardstyle-select-btn p-2 rounded-xl border border-white/20 bg-cyan-950 text-white text-xs font-bold truncate">シアン</button>
              <button data-cardstyle="card-glass-purple" class="cardstyle-select-btn p-2 rounded-xl border border-white/20 bg-purple-950 text-white text-xs font-bold truncate">パープル</button>
              <button data-cardstyle="card-glass-emerald" class="cardstyle-select-btn p-2 rounded-xl border border-white/20 bg-emerald-950 text-white text-xs font-bold truncate">深緑</button>
              <button data-cardstyle="card-glass-amber" class="cardstyle-select-btn p-2 rounded-xl border border-white/20 bg-amber-950 text-white text-xs font-bold truncate">アンバー</button>
              <button data-cardstyle="card-glass-rose" class="cardstyle-select-btn p-2 rounded-xl border border-white/20 bg-rose-950 text-white text-xs font-bold truncate">深紅DbD</button>
              <button data-cardstyle="card-glass-navy" class="cardstyle-select-btn p-2 rounded-xl border border-white/20 bg-blue-950 text-white text-xs font-bold truncate">夜空紺</button>
              <button data-cardstyle="card-solid-dark" class="cardstyle-select-btn p-2 rounded-xl border border-white/20 bg-black text-white text-xs font-bold truncate">漆黒ブラック</button>
            </div>
          </div>

          <!-- 壁紙一覧 -->
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1.5">背景壁紙（タップで選択）</label>
            <div class="space-y-1.5 max-h-48 overflow-y-auto" id="themeOptionList">
              <button data-wall="wall-chibi-room" class="wall-select-btn w-full p-2 rounded-xl border border-white/20 text-left flex items-center gap-2 bg-slate-800 text-xs font-bold">
                <img src="images/wallpapers/bg_chibi_crossover.jpg" class="w-8 h-8 rounded-lg object-cover">
                <span>🌟 デフォルメ1：ゲーマーズルーム</span>
              </button>
              <button data-wall="wall-chibi-arcade" class="wall-select-btn w-full p-2 rounded-xl border border-white/20 text-left flex items-center gap-2 bg-slate-800 text-xs font-bold">
                <img src="images/wallpapers/bg_chibi_arcade.jpg" class="w-8 h-8 rounded-lg object-cover">
                <span>🌟 デフォルメ2：ネオンアーケード</span>
              </button>
              <button data-wall="wall-chibi-campfire" class="wall-select-btn w-full p-2 rounded-xl border border-white/20 text-left flex items-center gap-2 bg-slate-800 text-xs font-bold">
                <img src="images/wallpapers/bg_chibi_campfire.jpg" class="w-8 h-8 rounded-lg object-cover">
                <span>🌟 デフォルメ3：焚き火キャンプチル</span>
              </button>
              <button data-wall="wall-chibi-gym" class="wall-select-btn w-full p-2 rounded-xl border border-white/20 text-left flex items-center gap-2 bg-slate-800 text-xs font-bold">
                <img src="images/wallpapers/bg_chibi_gym.jpg" class="w-8 h-8 rounded-lg object-cover">
                <span>🌟 デフォルメ4：ワークアウトジム</span>
              </button>
              <button data-wall="wall-chibi-streamer" class="wall-select-btn w-full p-2 rounded-xl border border-white/20 text-left flex items-center gap-2 bg-slate-800 text-xs font-bold">
                <img src="images/wallpapers/bg_chibi_streamer.jpg" class="w-8 h-8 rounded-lg object-cover">
                <span>🌟 デフォルメ5：動画制作スタジオ</span>
              </button>
              <button data-wall="wall-chibi-rooftop" class="wall-select-btn w-full p-2 rounded-xl border border-white/20 text-left flex items-center gap-2 bg-slate-800 text-xs font-bold">
                <img src="images/wallpapers/bg_chibi_rooftop.jpg" class="w-8 h-8 rounded-lg object-cover">
                <span>🌟 デフォルメ6：ネオンシティ屋上</span>
              </button>
              <button data-wall="wall-dbd" class="wall-select-btn w-full p-2 rounded-xl border border-white/20 text-left flex items-center gap-2 bg-slate-800 text-xs font-bold">
                <img src="images/wallpapers/bg_dbd.png" class="w-8 h-8 rounded-lg object-cover">
                <span>💀 DbD トラッパー</span>
              </button>
              <button data-wall="wall-infinitas" class="wall-select-btn w-full p-2 rounded-xl border border-white/20 text-left flex items-center gap-2 bg-slate-800 text-xs font-bold">
                <img src="images/wallpapers/bg_infinitas.jpg" class="w-8 h-8 rounded-lg object-cover">
                <span>🎵 beatmania INFINITAS</span>
              </button>
              <button data-wall="wall-yoyo" class="wall-select-btn w-full p-2 rounded-xl border border-white/20 text-left flex items-center gap-2 bg-slate-800 text-xs font-bold">
                <img src="images/wallpapers/bg_yoyo.jpg" class="w-8 h-8 rounded-lg object-cover">
                <span>🪀 ヨーヨー</span>
              </button>
              <button data-wall="wall-muscle" class="wall-select-btn w-full p-2 rounded-xl border border-white/20 text-left flex items-center gap-2 bg-slate-800 text-xs font-bold">
                <img src="images/wallpapers/bg_muscle.jpg" class="w-8 h-8 rounded-lg object-cover">
                <span>💪 筋トレ</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 項目タブ -->
        <div id="tab-items" class="tab-content space-y-3 hidden">
          <div class="p-3 bg-slate-800 rounded-xl space-y-2">
            <div class="text-xs font-bold text-slate-300">新しい項目を追加</div>
            <div class="flex gap-2">
              <input id="newItemName" type="text" placeholder="例: 読書、映画" class="flex-1 px-2.5 py-1 text-xs rounded-lg bg-slate-700 text-white border border-white/10">
              <input id="newItemColor" type="color" value="#059669" class="w-9 h-8 p-0.5 rounded-lg border border-white/10 cursor-pointer">
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-400">アイコン:</span>
              <select id="newItemIcon" class="flex-1 px-2 py-1 text-xs rounded-lg bg-slate-700 text-white border border-white/10">
                <option value="star">★ スター</option>
                <option value="game">🎮 ゲーム</option>
                <option value="heart">♥ ハート</option>
                <option value="dbd">💀 DbD</option>
                <option value="soundgame">🎵 音ゲー</option>
                <option value="yoyo">🪀 ヨーヨー</option>
                <option value="muscle">💪 筋トレ</option>
                <option value="youtube">▶ 動画作成</option>
              </select>
            </div>
            <button id="addNewItemBtn" class="w-full py-1.5 text-xs font-bold bg-indigo-600 rounded-lg text-white">
              ＋ 追加
            </button>
          </div>
          <div id="settingsItemList" class="space-y-1.5 max-h-40 overflow-y-auto"></div>
        </div>

        <!-- データタブ -->
        <div id="tab-backup" class="tab-content space-y-3 hidden">
          <p class="text-xs text-slate-400">バックアップや他端末への引き継ぎが可能です。</p>
          <button id="exportDataBtn" class="w-full py-2 text-xs font-bold bg-slate-800 border border-white/15 rounded-xl text-white">
            データをダウンロード (JSON)
          </button>
          <label class="w-full py-2 text-xs font-bold bg-slate-800 border border-white/15 rounded-xl text-white flex items-center justify-center cursor-pointer">
            データを読み込む
            <input type="file" id="importDataInput" accept=".json" class="hidden">
          </label>
        </div>
      </div>

      <div class="p-3 border-t border-white/10 bg-slate-800/90 flex justify-end pb-safe">
        <button id="closeSettingsModalBtn2" class="px-5 py-1.5 text-xs font-black bg-indigo-600 rounded-xl text-white">
          完了
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
